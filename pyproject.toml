[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assoc-ontology"
version = "0.1.0"
description = "Append-only Parquet store for accountable company associations and 2nd/3rd-order baskets"
requires-python = ">=3.12"
dependencies = ["pyarrow>=16"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
assoc-ontology = "assoc_ontology.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/assoc_ontology"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
